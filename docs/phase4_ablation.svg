<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 312" width="834" height="312" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id='t'>Phase 4 ablation: attack success against true false positives and task success, per arm</title>
<desc id='d'>`tool_permissions` alone cut attack success by 46 points (67% to 21%) with 0/450 (0%) true false positives (10/450 (2%) benign runs with any block) and 0 points of lost task success; `input_classifier` alone cut attack success by 21 points (67% to 46%) with 40/450 (9%) true false positives (40/450 (9%) benign runs with any block) and 9 points of lost task success. All six together: attack success 0/240 (0%), of which 21 runs were `did_not_execute` (the model wrote the call as text; no control credit) and 8 of 24 scenarios never succeeded at baseline; task success 410/450 (91%) to 365/450 (81%), with 40/450 (9%) benign runs lost to a control.</desc>
