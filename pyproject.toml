[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-risk-framework"
version = "0.0.1"
description = "Local, offline lab that measures how well layered defenses protect a tool-using LLM agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RJ" }]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
    # The agent's tools run behind a real MCP server (stdio); the loop drives an
    # async MCP client. anyio ships with mcp and is imported directly by the loop.
    "mcp>=2.3,<3",
    "anyio>=4.15,<5",
]

[project.optional-dependencies]
# Upper bounds keep CI from going red on a tool release alone (formatter or
# deprecation-warning changes); bump them deliberately.
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.17,<0.18",
    "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
# The leak guard runs git with fixed arguments and reads the GitHub API URL from the Actions
# environment; its tests use fake tokens and throwaway git repositories.
"tools/leak_guard.py" = ["S603", "S607", "S310"]
"tests/test_leak_guard.py" = ["S101", "S105", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
