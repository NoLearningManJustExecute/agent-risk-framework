name: PR text guard

# Rescans pull request text when a comment or review is posted or edited, since those events do
# not rerun CI. Runs the leak guard from the default branch.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  pr-text:
    if: github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the default branch's guard, never code from the pull request.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan pull request text
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/leak_guard.py --pr
