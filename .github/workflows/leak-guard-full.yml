name: Leak guard full scan

# Scheduled, non-blocking: the whole tree and every reachable commit, against the history
# baseline. The blocking gate in CI scans only the commits a change adds.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan tree and full history
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: python tools/leak_guard.py --all
